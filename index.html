<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코스믹 스네이크 (우주 지렁이 게임)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #03030d;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 245, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 128, 0.1) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            padding: 16px;
            overflow: hidden;
        }

        /* 우주 성운/먼지 효과 배경 캔버스 */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00f5ff, #bd00ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 16px rgba(0, 245, 255, 0.6));
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .scoreboard {
            display: flex;
            gap: 24px;
            background: rgba(15, 12, 41, 0.65);
            backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 16px;
            border: 1px solid rgba(0, 245, 255, 0.25);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.15), inset 0 0 15px rgba(189, 0, 255, 0.1);
            font-size: 1.05rem;
            font-weight: 600;
        }

        .scoreboard span {
            color: #00f5ff;
            font-weight: 800;
            text-shadow: 0 0 10px #00f5ff;
        }

        .game-wrapper {
            position: relative;
            box-shadow: 0 0 50px rgba(112, 0, 255, 0.35), 0 0 20px rgba(0, 245, 255, 0.3);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(0, 245, 255, 0.4);
            background: #050614;
        }

        canvas#gameCanvas {
            display: block;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(3, 4, 18, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #ff007f, #00f5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.7));
            text-transform: uppercase;
        }

        .overlay p {
            font-size: 1rem;
            color: #b8c7e0;
            text-align: center;
            line-height: 1.6;
        }

        .btn {
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #040615;
            background: linear-gradient(135deg, #00f5ff, #a700ff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 25px rgba(0, 245, 255, 0.6);
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 245, 255, 0.9), 0 0 20px rgba(189, 0, 255, 0.7);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .controls-info {
            margin-top: 14px;
            font-size: 0.88rem;
            color: #748ba7;
            display: flex;
            gap: 16px;
        }

        .controls-info span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* 터치/모바일 가상 패드 */
        .d-pad {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 56px);
            gap: 6px;
        }

        .d-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 12px;
            color: #00f5ff;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.2);
            touch-action: manipulation;
        }

        .d-btn:active {
            background: rgba(0, 245, 255, 0.3);
        }

        .d-up { grid-column: 2; grid-row: 1; }
        .d-left { grid-column: 1; grid-row: 2; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down { grid-column: 2; grid-row: 3; }

        @media (min-width: 600px) {
            .d-pad {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <div class="header">
            <h1>우주 지렁이 게임</h1>
            <div class="scoreboard">
                <div>점수: <span id="score">0</span></div>
                <div>최고 기록: <span id="high-score">0</span></div>
            </div>
        </div>

        <div class="game-wrapper">
            <canvas id="gameCanvas" width="440" height="440"></canvas>
            <div id="overlay" class="overlay">
                <h2 id="overlay-title">우주 탐험가</h2>
                <p id="overlay-desc">우주 에너지를 흡수하여 은하수 지렁이를 키우세요.<br>우주 벽이나 꼬리에 닿지 않도록 주의하세요!</p>
                <button id="start-btn" class="btn">워프 가동 (Space)</button>
            </div>
        </div>

        <div class="controls-info">
            <span>방향키 / WASD : 이동</span>
            <span>P : 일시정지</span>
            <span>Space : 시작</span>
        </div>

        <div style="margin-top: 10px; font-size: 0.85rem; color: #a5b9d4; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;">
            <span style="color:#00f5ff">● 플라즈마(+1점)</span>
            <span style="color:#ffd700">★ 슈퍼스타(+3점)</span>
            <span style="color:#ff3366">◆ 크리스탈(+2점)</span>
            <span style="color:#39ff14">▲ 양자워프(+2점)</span>
            <span style="color:#bf55ec">🪐 코스믹 행성(+2점)</span>
        </div>

        <div class="d-pad">
            <button class="d-btn d-up" id="btn-up">▲</button>
            <button class="d-btn d-left" id="btn-left">◀</button>
            <button class="d-btn d-right" id="btn-right">▶</button>
            <button class="d-btn d-down" id="btn-down">▼</button>
        </div>
    </div>

    <script>
        // --- 1. 배경 우주 별빛 애니메이션 ---
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgStars = [];

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            bgStars = [];
            const count = Math.floor((bgCanvas.width * bgCanvas.height) / 3500);
            for (let i = 0; i < count; i++) {
                bgStars.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    radius: Math.random() * 1.5 + 0.3,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005,
                    color: ['#ffffff', '#a8d8ea', '#ffcbf2', '#b8c0ff'][Math.floor(Math.random() * 4)]
                });
            }
        }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        function drawBackground() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            for (let star of bgStars) {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.1) star.speed = -star.speed;
                bgCtx.globalAlpha = Math.max(0.1, Math.min(1, star.alpha));
                bgCtx.fillStyle = star.color;
                bgCtx.beginPath();
                bgCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                bgCtx.fill();
            }
            bgCtx.globalAlpha = 1;
            requestAnimationFrame(drawBackground);
        }
        drawBackground();

        // --- 2. 게임 로직 및 우주 그래픽 렌더링 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('start-btn');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE; // 22x22
        const BASE_SPEED = 345; // 기존 대비 1배 더 느리게 (230ms -> 345ms)
        const TARGET_COUNT = 5; // 화면에 항상 유지되는 목표 타겟 개수 (기존 1개 + 추가 4개 = 총 5개)

        // 5종류의 우주 목표 타겟 타입 정의
        const TARGET_TYPES = [
            { id: 'plasma', name: '플라즈마 구체', score: 1, color: '#00f5ff', glow: '#00f5ff' },
            { id: 'star', name: '슈퍼스타', score: 3, color: '#ffd700', glow: '#ffaa00' },
            { id: 'crystal', name: '우주 크리스탈', score: 2, color: '#ff3366', glow: '#ff0055' },
            { id: 'warp', name: '양자 에너지', score: 2, color: '#39ff14', glow: '#00ff66' },
            { id: 'planet', name: '미니 행성', score: 2, color: '#bf55ec', glow: '#9b59b6' }
        ];

        let snake = [];
        let targets = []; // 5개의 타겟 배열
        let dx = 0, dy = 0;
        let nextDx = 0, nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_cosmic_high_score') || 0;
        let gameInterval = null;
        let isRunning = false;
        let isPaused = false;
        let animFrameId = null;

        // 반짝임 및 파티클 시스템
        let particles = [];
        let globalTime = 0;

        highScoreEl.textContent = highScore;

        // 게임판 내부 우주 별들
        const internalStars = [];
        for (let i = 0; i < 40; i++) {
            internalStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.6 + 0.4,
                twinkleSpeed: Math.random() * 0.05 + 0.02,
                twinkleOffset: Math.random() * Math.PI * 2
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 16; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1.2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 3 + 1.5,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        function createTrail(x, y, hue) {
            particles.push({
                x: x + (Math.random() - 0.5) * 6,
                y: y + (Math.random() - 0.5) * 6,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                size: Math.random() * 3.5 + 1.5,
                color: `hsl(${hue}, 100%, 75%)`,
                alpha: 0.85,
                decay: 0.05
            });
        }

        function initGame() {
            snake = [
                { x: 11, y: 11 },
                { x: 11, y: 12 },
                { x: 11, y: 13 },
                { x: 11, y: 14 }
            ];
            dx = 0; dy = -1;
            nextDx = 0; nextDy = -1;
            score = 0;
            scoreEl.textContent = score;
            particles = [];
            targets = [];
            // 화면에 5개의 목표 타겟 생성
            for (let i = 0; i < TARGET_COUNT; i++) {
                spawnTarget(i);
            }
        }

        function spawnTarget(typeIndex = null) {
            let attempts = 0;
            while (attempts < 200) {
                attempts++;
                const rx = Math.floor(Math.random() * TILE_COUNT);
                const ry = Math.floor(Math.random() * TILE_COUNT);
                
                // 지렁이 몸과 겹침 확인
                const collidesSnake = snake.some(s => s.x === rx && s.y === ry);
                // 다른 타겟과 겹침 확인
                const collidesTarget = targets.some(t => t.x === rx && t.y === ry);

                if (!collidesSnake && !collidesTarget) {
                    const chosenType = (typeIndex !== null && TARGET_TYPES[typeIndex]) 
                        ? TARGET_TYPES[typeIndex] 
                        : TARGET_TYPES[Math.floor(Math.random() * TARGET_TYPES.length)];
                    
                    targets.push({
                        x: rx,
                        y: ry,
                        type: chosenType,
                        createdTime: globalTime
                    });
                    break;
                }
            }
        }

        function startGame() {
            initGame();
            overlay.classList.add('hidden');
            isRunning = true;
            isPaused = false;
            clearInterval(gameInterval);
            gameInterval = setInterval(gameStep, getSpeed());
        }

        function getSpeed() {
            // 점수에 따라 점진적으로 빨라지되 여유로운 속도 유지 (최소 165ms)
            return Math.max(165, BASE_SPEED - Math.floor(score / 2) * 5);
        }

        function pauseGame() {
            if (!isRunning) return;
            isPaused = !isPaused;
            if (isPaused) {
                clearInterval(gameInterval);
                overlayTitle.textContent = "워프 일시정지";
                overlayDesc.textContent = "P키 또는 재개 버튼을 눌러 비행을 계속하세요.";
                startBtn.textContent = "비행 재개";
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
                gameInterval = setInterval(gameStep, getSpeed());
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            isRunning = false;

            // 머리 위치에서 게임오버 파티클 폭발
            if (snake[0]) {
                const hx = snake[0].x * GRID_SIZE + GRID_SIZE / 2;
                const hy = snake[0].y * GRID_SIZE + GRID_SIZE / 2;
                createExplosion(hx, hy, '#ff0055');
            }

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_cosmic_high_score', highScore);
                highScoreEl.textContent = highScore;
            }
            overlayTitle.textContent = "코스믹 충돌!";
            overlayDesc.innerHTML = `은하 탐사 점수: <b style="color:#00f5ff">${score}점</b><br>블랙홀에 빨려 들어갔습니다!`;
            startBtn.textContent = "재도전 (Space)";
            overlay.classList.remove('hidden');
        }

        function gameStep() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 벽 충돌 감지
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // 자기 몸 충돌
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 먹이(목표 타겟) 섭취 확인
            const eatenIndex = targets.findIndex(t => t.x === head.x && t.y === head.y);
            if (eatenIndex !== -1) {
                const eatenTarget = targets[eatenIndex];
                score += eatenTarget.type.score;
                scoreEl.textContent = score;

                // 획득 이펙트 파티클 (타겟 고유 색상으로 폭발)
                const fx = eatenTarget.x * GRID_SIZE + GRID_SIZE / 2;
                const fy = eatenTarget.y * GRID_SIZE + GRID_SIZE / 2;
                createExplosion(fx, fy, eatenTarget.type.glow);

                // 먹힌 타겟 제거 후 새 타겟 1개 재소환
                targets.splice(eatenIndex, 1);
                spawnTarget();

                clearInterval(gameInterval);
                gameInterval = setInterval(gameStep, getSpeed());
            } else {
                snake.pop();
            }
        }

        // --- 60fps 부드러운 그래픽 루프 ---
        function render() {
            globalTime += 0.05;

            // 1. 우주 배경 캔버스 클리어 및 그리드
            ctx.fillStyle = '#060719';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 보드 내부 반짝이는 우주 먼지/별
            for (let star of internalStars) {
                const alpha = 0.3 + 0.4 * Math.sin(globalTime * star.twinkleSpeed * 10 + star.twinkleOffset);
                ctx.fillStyle = `rgba(200, 230, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // 부드러운 네온 격자선
            ctx.strokeStyle = 'rgba(0, 245, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // 2. 파티클 업데이트 & 그리기
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 3. 우주 목표 타겟 5종 렌더링
            targets.forEach(target => {
                const tx = target.x * GRID_SIZE + GRID_SIZE / 2;
                const ty = target.y * GRID_SIZE + GRID_SIZE / 2;
                const tType = target.type;
                const pulse = Math.sin(globalTime * 3.5 + target.x) * 2;

                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = tType.glow;

                if (tType.id === 'plasma') {
                    // 1) 플라즈마 구체
                    const grad = ctx.createRadialGradient(tx, ty, 2, tx, ty, GRID_SIZE / 2 + pulse);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.5, tType.color);
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(tx, ty, GRID_SIZE / 2 - 1 + pulse, 0, Math.PI * 2);
                    ctx.fill();
                } else if (tType.id === 'star') {
                    // 2) 슈퍼스타 (반짝이는 별 모양)
                    ctx.fillStyle = tType.color;
                    ctx.translate(tx, ty);
                    ctx.rotate(globalTime * 1.5);
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * (GRID_SIZE / 2 + pulse * 0.5),
                                   -Math.sin((18 + i * 72) * Math.PI / 180) * (GRID_SIZE / 2 + pulse * 0.5));
                        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * 4,
                                   -Math.sin((54 + i * 72) * Math.PI / 180) * 4);
                    }
                    ctx.closePath();
                    ctx.fill();
                } else if (tType.id === 'crystal') {
                    // 3) 우주 크리스탈 (회전하는 다이아몬드)
                    ctx.fillStyle = tType.color;
                    ctx.translate(tx, ty);
                    ctx.rotate(globalTime * 2);
                    const s = (GRID_SIZE / 2 - 2) + pulse * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s, 0);
                    ctx.lineTo(0, s);
                    ctx.lineTo(-s, 0);
                    ctx.closePath();
                    ctx.fill();
                    // 안쪽 빛
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (tType.id === 'warp') {
                    // 4) 양자 워프 에너지 (삼각형 역동 코어)
                    ctx.fillStyle = tType.color;
                    ctx.translate(tx, ty);
                    ctx.rotate(-globalTime * 2.5);
                    const r = (GRID_SIZE / 2 - 1) + pulse * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(0, -r);
                    ctx.lineTo(r * 0.866, r * 0.5);
                    ctx.lineTo(-r * 0.866, r * 0.5);
                    ctx.closePath();
                    ctx.fill();
                } else if (tType.id === 'planet') {
                    // 5) 고리가 있는 미니 행성
                    ctx.fillStyle = tType.color;
                    ctx.beginPath();
                    ctx.arc(tx, ty, 6, 0, Math.PI * 2);
                    ctx.fill();
                    // 행성 고리
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.ellipse(tx, ty, 9.5 + pulse * 0.4, 3.5, Math.PI / 6, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            });

            // 4. 은하수 오로라 지렁이 렌더링
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                const progress = index / Math.max(1, snake.length);

                // 무지개 은하수 네온 컬러 그라데이션 (시안 -> 퍼플 -> 마젠타)
                const baseHue = (globalTime * 30 + index * 10) % 360;
                const segCenterX = segment.x * GRID_SIZE + GRID_SIZE / 2;
                const segCenterY = segment.y * GRID_SIZE + GRID_SIZE / 2;

                // 꼬리에서 우주 별가루 방출 (running 상태일 때)
                if (isRunning && Math.random() < 0.25) {
                    createTrail(segCenterX, segCenterY, baseHue);
                }

                ctx.save();

                // 네온 글로우 발광
                const glowIntensity = isHead ? 22 : 12;
                ctx.shadowBlur = glowIntensity + Math.sin(globalTime * 4 + index) * 4;
                ctx.shadowColor = `hsl(${baseHue}, 100%, 65%)`;

                // 세그먼트 크기 (머리가 가장 크고 꼬리로 갈수록 얇아지는 유선형 바디)
                const scale = isHead ? 1 : Math.max(0.65, 1 - progress * 0.35);
                const segRadius = (GRID_SIZE / 2 - 1.5) * scale;

                // 구체 그라데이션
                const segGrad = ctx.createRadialGradient(
                    segCenterX - 2, segCenterY - 2, 1,
                    segCenterX, segCenterY, segRadius
                );

                if (isHead) {
                    segGrad.addColorStop(0, '#ffffff');
                    segGrad.addColorStop(0.4, `hsl(${baseHue}, 100%, 75%)`);
                    segGrad.addColorStop(1, `hsl(${baseHue}, 100%, 45%)`);
                } else {
                    segGrad.addColorStop(0, `hsl(${baseHue}, 100%, 85%)`);
                    segGrad.addColorStop(0.6, `hsl(${baseHue}, 100%, 60%)`);
                    segGrad.addColorStop(1, `hsl(${(baseHue + 30) % 360}, 90%, 40%)`);
                }

                ctx.fillStyle = segGrad;
                ctx.beginPath();
                ctx.arc(segCenterX, segCenterY, segRadius, 0, Math.PI * 2);
                ctx.fill();

                // 머리 눈빛 (신비로운 블루-화이트 눈)
                if (isHead) {
                    let eyeOffset1 = { x: 0, y: 0 };
                    let eyeOffset2 = { x: 0, y: 0 };

                    if (dx === 1) { // 우
                        eyeOffset1 = { x: 4, y: -4 };
                        eyeOffset2 = { x: 4, y: 4 };
                    } else if (dx === -1) { // 좌
                        eyeOffset1 = { x: -4, y: -4 };
                        eyeOffset2 = { x: -4, y: 4 };
                    } else if (dy === -1) { // 상
                        eyeOffset1 = { x: -4, y: -4 };
                        eyeOffset2 = { x: 4, y: -4 };
                    } else { // 하
                        eyeOffset1 = { x: -4, y: 4 };
                        eyeOffset2 = { x: 4, y: 4 };
                    }

                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ffffff';
                    ctx.fillStyle = '#ffffff';

                    ctx.beginPath();
                    ctx.arc(segCenterX + eyeOffset1.x, segCenterY + eyeOffset1.y, 2.4, 0, Math.PI * 2);
                    ctx.arc(segCenterX + eyeOffset2.x, segCenterY + eyeOffset2.y, 2.4, 0, Math.PI * 2);
                    ctx.fill();

                    // 동공
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#050a24';
                    ctx.beginPath();
                    ctx.arc(segCenterX + eyeOffset1.x + (dx * 0.8), segCenterY + eyeOffset1.y + (dy * 0.8), 1.2, 0, Math.PI * 2);
                    ctx.arc(segCenterX + eyeOffset2.x + (dx * 0.8), segCenterY + eyeOffset2.y + (dy * 0.8), 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });

            animFrameId = requestAnimationFrame(render);
        }

        function changeDirection(newDx, newDy) {
            if ((newDx !== 0 && dx === -newDx) || (newDy !== 0 && dy === -newDy)) {
                return;
            }
            nextDx = newDx;
            nextDy = newDy;
        }

        // 키보드 조작
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (e.code === 'Space') {
                e.preventDefault();
                if (!isRunning || isPaused) {
                    if (isPaused) pauseGame();
                    else startGame();
                }
                return;
            }

            if (key === 'p') {
                pauseGame();
                return;
            }

            if (!isRunning || isPaused) return;

            switch (key) {
                case 'arrowup':
                case 'w':
                    changeDirection(0, -1);
                    break;
                case 'arrowdown':
                case 's':
                    changeDirection(0, 1);
                    break;
                case 'arrowleft':
                case 'a':
                    changeDirection(-1, 0);
                    break;
                case 'arrowright':
                case 'd':
                    changeDirection(1, 0);
                    break;
            }
        });

        // UI 버튼
        startBtn.addEventListener('click', () => {
            if (isPaused) pauseGame();
            else startGame();
        });

        document.getElementById('btn-up').addEventListener('click', () => changeDirection(0, -1));
        document.getElementById('btn-down').addEventListener('click', () => changeDirection(0, 1));
        document.getElementById('btn-left').addEventListener('click', () => changeDirection(-1, 0));
        document.getElementById('btn-right').addEventListener('click', () => changeDirection(1, 0));

        // 초기 시작
        initGame();
        render();
    </script>
</body>
</html>
